services:
  # 1. FastAPI Backend API (Cloud Server)
  - type: web
    name: sbusinesscard-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://gpqbdbsehgrkkftrqjvd.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_ci4Bz0q-Wwdm2jKbivmHeg_3j4lbP3l
      - key: JWT_SECRET_KEY
        generateValue: true

  # 2. Super Admin Web Dashboard
  - type: web
    name: sbusinesscard-admin
    env: static
    rootDir: web-admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
